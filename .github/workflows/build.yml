# Compile and check the project on every push that is not a release.
#
# Work in progress is what this is for: branches and pull requests, where
# there is no tag and nothing to publish, and a commit that does not build
# should be a red mark on the commit rather than a discovery made during a
# release.
#
# Not main. Every push to main carries a new version and a tag pushed just
# before it, and the tag's Release run compiles and checks that very commit —
# running this as well meant one version produced two compiles of identical
# code and three rows in the Actions list for one release. So main is the
# Release run's, and this is everything else's.
#
# What main gives up by not being here is a run of its own when the tag was
# forgotten. The tag is the release; a push without one was never going to
# reach a server anyway, and the Release run refuses a tag that disagrees with
# the version in config.go, which is the mistake that actually happens.
name: Build

on:
  push:
    branches:
      - "**"
      # main belongs to the Release run. Negated here rather than in a
      # branches-ignore of its own: GitHub refuses a filter that has both.
      - "!main"
    # Tags are the release workflow's job, and it runs the same checks.
    tags-ignore:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Check the Go code
        run: |
          go vet ./...
          go test ./...

      # gofmt is not style policing here: an unformatted file is a file that
      # was edited by something that did not run the toolchain, which is worth
      # knowing before it reaches a release.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
              echo "These files are not gofmt'd:"
              echo "$unformatted"
              exit 1
          fi

      # Both architectures a release ships for, so a build that only breaks on
      # arm64 breaks here rather than during the release.
      - name: Compile for both architectures
        run: |
          for arch in amd64 arm64; do
              echo "==> linux/$arch"
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
                  go build -trimpath -ldflags "-s -w" \
                  -o "/tmp/ubuntu-panel-$arch" ./cmd/ubuntu-panel
          done

      # The version constant is what the panel reports and what the updater
      # compares against, so a push that forgot to move it is a release that
      # claims to be the previous one.
      - name: Report the version this commit claims
        run: grep -n 'Version = ' internal/config/config.go
