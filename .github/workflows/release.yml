# Build the release tarballs and publish them, so nothing is ever compiled on
# the server the panel is installed on.
#
# The tag is the release, and this is the only thing that builds one. It checks
# the code, builds the frontend once, cross-compiles the binary for amd64 and
# arm64 (CGO is off and the SQLite driver is pure Go, so no cross-toolchain is
# involved), and attaches both tarballs and their SHA-256 files to the release
# get.sh downloads from.
#
# It used to run on pushes to main as well, tagging the commit itself when the
# version had no tag yet. That safety net cost a run on every single push: the
# tag is pushed first, so by the time main arrived the release had already been
# published and the second run had nothing to do but say so — an entry in the
# Actions list for eleven seconds of nothing, next to a Build run compiling the
# same commit a second time. One version, one run. What the net used to catch
# is caught by Build instead, which now fails a push to main whose version has
# no tag rather than quietly tagging it.
name: Release

# The run's own title, which is what the Actions list shows in bold. Without
# it a tag push is titled "Release" and the version is only readable from the
# small ref chip beside it.
run-name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

on:
  push:
    tags:
      - "v*"

  # Also runnable by hand, for a release built from a branch rather than a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # build-release.sh stamps the release with `git describe`, which needs
          # the tags a shallow clone does not fetch.
          fetch-depth: 0

      # What is being released. The tag that triggered the run, or the version
      # typed into a manual one — and either way it has to agree with the
      # number in config.go, which is what the panel reports and what the
      # updater compares against. A release built from a commit claiming a
      # different version is a release every server ignores.
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              version="${{ github.event.inputs.version }}"
          else
              version="${{ github.ref_name }}"
          fi

          claimed="v$(sed -n 's/.*Version = "\(.*\)".*/\1/p' \
              internal/config/config.go | head -1)"

          if [ -z "$version" ] || [ "$version" = "v" ]; then
              echo "No version to release"
              exit 1
          fi

          if [ "$version" != "$claimed" ]; then
              echo "The tag says $version and internal/config/config.go says $claimed."
              echo "The panel would report $claimed while the release offered $version,"
              echo "so every server would keep updating to it for ever."
              exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=${version#v}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Everything the Build workflow checks, because this is the only run a
      # release commit gets: Build stays off main so that one version means one
      # run, and a release that skipped the checks is worse than a second run.
      - name: Check
        run: |
          go vet ./...
          go test ./...

          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
              echo "These files are not gofmt'd:"
              echo "$unformatted"
              exit 1
          fi

      # Tagged before the tarballs are built, so the release and the commit it
      # was built from can never disagree. A tag push has one already.
      - name: Tag the commit
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
              -m "Ubuntu Panel ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Build the release tarballs
        env:
          PANEL_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh amd64 arm64

      - name: Prove the binaries are static
        run: |
          for binary in $(find dist -name '*.tar.gz'); do
              tar -xzf "$binary" -C /tmp
          done

          for binary in /tmp/ubuntu-panel-*/ubuntu-panel; do
              file "$binary"
              # A dynamically linked binary would need libraries on the server,
              # which is the whole thing this build exists to avoid.
              file "$binary" | grep -q 'statically linked' \
                  || { echo "$binary is not static"; exit 1; }
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          # Titled rather than left to inherit the tag's name: a release is a
          # version of the panel, and that is what the title should say.
          name: Ubuntu Panel ${{ steps.version.outputs.number }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
